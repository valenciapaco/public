<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Panel del diplomado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --morado-900:#2b1450;--morado-800:#3a1d5e;--morado-700:#4a2577;--morado-600:#5b2c8f;
  --morado-400:#9b7cc9;--morado-200:#d9ccef;--morado-100:#efe9f8;--morado-50:#f7f4fc;
  --rosa:#a8418f;--rosa-100:#f7e6f2;
  --tinta:#1c1530;--gris:#5f5872;--linea:#e4def0;--fondo:#faf8fd;--blanco:#fff;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;overflow-wrap:anywhere;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.55}
a{color:var(--morado-600)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--morado-800);color:#fff;padding:28px 0 36px}
header.top .wrap{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{height:46px;width:auto;filter:brightness(0) invert(1)}
.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin:0 0 6px}
h1{font-size:clamp(24px,4.5vw,34px);line-height:1.15;margin:0;font-weight:800}
.sub{margin:8px 0 0;opacity:.85;font-size:15px}
main{margin-top:-18px;padding-bottom:56px}
section{margin-top:28px}
h2{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--morado-700);margin:0 0 12px;font-weight:700}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:18px 20px}
.aviso{border-left:5px solid var(--morado-600);margin-bottom:12px}
.aviso.pendiente{border-left-color:var(--rosa);background:linear-gradient(0deg,var(--blanco),var(--blanco)),var(--rosa-100)}
.aviso h3{margin:0 0 6px;font-size:17px}
.aviso p{margin:0;color:var(--gris)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{background:var(--rosa-100);color:var(--rosa);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--morado-600);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 16px;border-radius:10px;margin-top:12px}
.btn:hover{background:var(--morado-700)}
.btn.sec{background:var(--morado-100);color:var(--morado-700)}
.btn.sec:hover{background:var(--morado-200)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.sesion .cuando{font-size:13px;font-weight:700;color:var(--morado-600);text-transform:uppercase;letter-spacing:1px}
.sesion h3{margin:6px 0 4px;font-size:19px;line-height:1.3}
.sesion .meta{color:var(--gris);font-size:14px;margin:0}
.lee{margin-top:14px;padding-top:12px;border-top:1px dashed var(--linea);font-size:15px}
.lee strong{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);margin-bottom:4px}
.lee a{font-weight:600}
.pend{color:var(--gris);font-style:italic}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.entrega{display:grid;grid-template-columns:1fr;gap:4px}
.entrega .que{font-weight:700;font-size:17px}
.entrega .cuando{color:var(--rosa);font-weight:600}
.entrega .nota{color:var(--gris);font-size:14px}
.recursos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.recurso{display:block;text-decoration:none;color:inherit;background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:16px;transition:border-color .15s,transform .15s}
.recurso:hover{border-color:var(--morado-400);transform:translateY(-2px)}
.recurso b{display:block;color:var(--morado-700);margin-bottom:4px}
.recurso span{color:var(--gris);font-size:14px}
ol.pasos{margin:0;padding-left:22px}
ol.pasos li{margin:6px 0}
ul.reglas{margin:12px 0 0;padding-left:20px;color:var(--gris)}
ul.reglas li{margin:4px 0}
.reglas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.reglas-grid h3{margin:0 0 6px;font-size:16px;color:var(--morado-700)}
.reglas-grid ul{margin:0;padding-left:18px;color:var(--gris);font-size:15px}
details{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:14px 18px;font-weight:700;color:var(--morado-800);list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--morado-400);font-weight:800}
details[open] summary::after{content:"−"}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td{padding:10px 18px;border-top:1px solid var(--linea);vertical-align:top}
.tabla .t{white-space:nowrap;color:var(--gris);width:1%}
.tabla .tt{font-weight:600}
.tabla .doc{color:var(--gris);font-size:13px;display:block;font-weight:400}
.estado{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.estado.hecha{background:#ece9f2;color:#7a7390}
.estado.ahora{background:var(--morado-600);color:#fff}
tr.pasada td{opacity:.7}
footer{color:var(--gris);font-size:13px;text-align:center;padding:24px 16px 40px}
.err{background:var(--rosa-100);color:var(--rosa);padding:14px;border-radius:12px}
@media (max-width:560px){
  .tabla td{padding:9px 12px}
  .tabla .t{white-space:normal}
  header.top{padding:22px 0 30px}
  .logo{height:38px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <p class="kicker">Diplomado en Habilidades Directivas para la Era de la IA</p>
      <h1>Panel del diplomado</h1>
      <p class="sub" id="sub">Todo lo que necesitas para la semana, en un solo lugar.</p>
    </div>
    <img class="logo" src="logo-unla.png" alt="UNLA">
  </div>
</header>

<main class="wrap" id="app">
  <p class="card">Cargando…</p>
</main>

<footer id="pie"></footer>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link = (url, texto, cls = 'btn') => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(texto)}</a>`;
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const fechaCorta = iso => { const d = new Date(iso + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

function render(d) {
  const hoy = hoyISO();
  $('#sub').textContent = `${d.semana} · Actualizado el ${fechaCorta(d.actualizado)}`;

  const avisos = d.avisos.map(a => `
    <div class="card aviso ${esc(a.tipo)}">
      <h3>${esc(a.titulo)}</h3>
      <p>${esc(a.texto)}</p>
      ${a.faltan?.length ? `<div class="chips">${a.faltan.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>` : ''}
      ${a.enlace ? link(a.enlace.url, a.enlace.texto) : ''}
    </div>`).join('');

  const sesiones = d.esta_semana.map(s => `
    <div class="card sesion">
      <div class="cuando">${esc(s.fecha)} · ${esc(s.horario)}</div>
      <h3>${esc(s.tema)} · ${esc(s.titulo)}</h3>
      <p class="meta">${esc(s.docente)}</p>
      <div class="lee"><strong>Para leer antes</strong>
        ${s.lectura.length ? s.lectura.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.texto)}</a>`).join('<br>') : `<span class="pend">${esc(s.lectura_pendiente || 'Sin lectura previa.')}</span>`}
      </div>
      <div class="acciones">
        ${link(d.webex[s.dia], 'Entrar a Webex')}
        ${s.carpeta ? link(s.carpeta, 'Materiales de la sesión', 'btn sec') : ''}
      </div>
    </div>`).join('');

  const entregas = d.entregas.map(e => `
    <div class="card entrega">
      <span class="que">${esc(e.que)}</span>
      <span class="cuando">${esc(e.cuando)}</span>
      <span>Dónde: ${esc(e.donde)}</span>
      ${e.nota ? `<span class="nota">${esc(e.nota)}</span>` : ''}
    </div>`).join('');

  const recursos = d.recursos.map(r => `
    <a class="recurso" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.titulo)}</b><span>${esc(r.texto)}</span></a>`).join('');

  const rp = d.reposicion;
  const reposicion = `
    <div class="card">
      <ol class="pasos">${rp.pasos.map(p => `<li>${esc(p)}</li>`).join('')}</ol>
      ${rp.aviso_url ? link(rp.aviso_url, 'Avisar que ya subí mi nota') : `<p class="pend" style="margin:10px 0 0">${esc(rp.aviso_texto)}</p>`}
      <ul class="reglas">${rp.reglas.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      ${link(d.recursos[0].url, 'Ver las grabaciones', 'btn sec')}
    </div>`;

  const reglas = `<div class="reglas-grid">${d.reglas.map(r => `
    <div class="card"><h3>${esc(r.titulo)}</h3><ul>${r.puntos.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}</div>`;

  const temasSemana = new Set(d.esta_semana.map(s => s.tema));
  const calendario = d.calendario.map(m => {
    const abierto = m.sesiones.some(s => s.fecha >= hoy) && m.sesiones.some(s => s.fecha <= addDays(hoy, 14));
    const filas = m.sesiones.map(s => {
      const pasada = s.fecha < hoy && !temasSemana.has(s.tema);
      const estado = temasSemana.has(s.tema) ? '<span class="estado ahora">Esta semana</span>' : (pasada ? '<span class="estado hecha">Impartida</span>' : '');
      const titulo = s.carpeta ? `<a href="${esc(s.carpeta)}" target="_blank" rel="noopener">${esc(s.titulo)}</a>` : esc(s.titulo);
      return `<tr class="${pasada ? 'pasada' : ''}"><td class="t">${esc(s.tema)}<br>${fechaCorta(s.fecha)}</td><td class="tt">${titulo}${estado}<span class="doc">${esc(s.docente)}</span></td></tr>`;
    }).join('');
    return `<details ${abierto ? 'open' : ''}><summary>${esc(m.modulo)}</summary><table class="tabla">${filas}</table></details>`;
  }).join('');

  $('#app').innerHTML = `
    <section>${avisos}</section>
    <section><h2>Esta semana</h2><div class="grid2">${sesiones}</div></section>
    <section><h2>Entregas</h2>${entregas}</section>
    <section><h2>La próxima semana</h2><div class="card"><p style="margin:0">${esc(d.proxima_semana.texto)}</p></div></section>
    <section><h2>Recursos</h2><div class="recursos">${recursos}</div></section>
    <section><h2>Si faltaste: cómo reponer la asistencia</h2>${reposicion}</section>
    <section><h2>Reglas del juego</h2>${reglas}</section>
    <section><h2>Calendario de las 45 sesiones</h2><p style="margin:-4px 0 12px;color:var(--gris);font-size:14px">Viernes de 16:00 a 20:00 y sábados de 9:00 a 13:00, en línea por Webex.</p>${calendario}</section>`;
  $('#pie').textContent = 'Universidad Latina de América · Educación Continua · Coordinación: Francisco Valencia';
}

function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

fetch('data.json', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { $('#app').innerHTML = '<p class="err">No se pudo cargar la información. Recarga la página en un momento.</p>'; });
</script>
</body>
</html>
