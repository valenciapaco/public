<style>
  :root{
    --bg:#14101B;
    --bg-2:#1F1729;
    --card:#241A33;
    --border:#3A2E4D;
    --purple:#3D1A5B;
    --purple-light:#6B3FA0;
    --gold:#C9A227;
    --gold-light:#E8C55C;
    --text:#F5F1E8;
    --text-dim:#B8AFC7;
    --danger:#E8622C;
    --ok:#7FD8A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:24px 20px 80px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:0 0 12px;}
  h1{font-size:1.6rem;}
  h2{font-size:1.35rem;color:var(--gold-light);}
  h3{font-size:1.05rem;color:var(--text);}
  p{margin:0 0 14px;color:var(--text-dim);}
  strong{color:var(--text);}
  .progress{
    position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:10;
  }
  .progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--purple-light),var(--gold));transition:width .3s ease;}
  .progress-label{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-dim);margin-top:6px;letter-spacing:.03em;}
  .screen{display:none;animation:fadeIn .35s ease;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:20px;margin-bottom:16px;
  }
  .btn{
    display:inline-block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;
    padding:13px 22px;border-radius:10px;border:1px solid var(--gold);
    background:transparent;color:var(--gold-light);cursor:pointer;
    transition:all .15s ease;text-align:center;
  }
  .btn:hover{background:var(--gold);color:var(--bg);}
  .btn-primary{background:var(--gold);color:var(--bg);}
  .btn-primary:hover{background:var(--gold-light);}
  .btn-ghost{border-color:var(--border);color:var(--text-dim);}
  .btn-ghost:hover{background:var(--bg-2);color:var(--text);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .btn-row.center{justify-content:center;}
  .btn-block{width:100%;}
  .reactions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;}
  .reactions button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.85rem;
    padding:12px 8px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-2);color:var(--text-dim);cursor:pointer;transition:all .15s ease;
  }
  .reactions button:hover{border-color:var(--gold);color:var(--text);}
  .reactions button.selected{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  .name-hero{font-family:'Space Grotesk',sans-serif;font-size:2.4rem;font-weight:700;color:var(--gold-light);margin-bottom:2px;}
  .name-sub{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--text-dim);margin-bottom:14px;}
  .avail{
    font-family:'JetBrains Mono',monospace;font-size:.78rem;background:var(--bg-2);
    border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:16px;color:var(--ok);
  }
  .risk{
    font-size:.85rem;color:var(--text-dim);border-top:1px dashed var(--border);
    margin-top:12px;padding-top:12px;
  }
  .risk strong{color:var(--gold-light);}
  ol.orderlist,ul.orderlist{list-style:none;margin:0;padding:0;}
  .order-item{
    display:flex;align-items:center;gap:10px;background:var(--bg-2);
    border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;
  }
  .order-item .pos{font-family:'JetBrains Mono',monospace;color:var(--gold);font-weight:700;min-width:20px;}
  .order-item .name{flex:1;font-weight:600;}
  .order-item .arrows{display:flex;gap:4px;}
  .order-item .arrows button{
    background:var(--card);border:1px solid var(--border);color:var(--text-dim);
    border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:.9rem;
  }
  .order-item .arrows button:hover{border-color:var(--gold);color:var(--gold-light);}
  .order-item .arrows button:disabled{opacity:.3;cursor:default;}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.88rem;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-dim);vertical-align:top;}
  th{color:var(--gold-light);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;}
  td:first-child{color:var(--text);font-weight:600;white-space:nowrap;}
  .round-title{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--gold-light);margin:20px 0 4px;font-size:.95rem;}
  textarea,input[type=text]{
    width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem;padding:12px;resize:vertical;
  }
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--gold);}
  .quote{
    background:var(--bg-2);border-left:3px solid var(--gold);padding:12px 16px;
    border-radius:0 8px 8px 0;margin:14px 0;color:var(--text-dim);font-style:italic;
  }
  .slider-block{margin-bottom:22px;}
  .slider-labels{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);margin-bottom:6px;}
  input[type=range]{
    width:100%;height:4px;background:var(--border);border-radius:2px;-webkit-appearance:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;}
  .palette-card{
    background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;
  }
  .palette-card.chosen{border-color:var(--gold);}
  .palette-card.discarded{opacity:.4;}
  .swatches{display:flex;gap:6px;margin:10px 0;}
  .swatch{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.15);}
  .palette-actions{display:flex;gap:8px;margin-top:8px;}
  .palette-actions button{
    font-size:.78rem;padding:7px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text-dim);cursor:pointer;
  }
  .palette-actions button.on-like{background:var(--gold);color:var(--bg);border-color:var(--gold);}
  .palette-actions button.on-discard{background:var(--danger);color:var(--bg);border-color:var(--danger);}
  .type-block{margin-bottom:24px;}
  .type-options{display:grid;gap:8px;}
  .type-option{
    background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
    cursor:pointer;transition:all .15s ease;
  }
  .type-option:hover{border-color:var(--gold);}
  .type-option.selected{border-color:var(--gold);background:rgba(201,162,39,.1);}
  .type-sample{font-size:1.5rem;color:var(--text);}
  .type-name{font-size:.75rem;color:var(--text-dim);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .checkbox-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;background:var(--bg-2);padding:12px 14px;border-radius:10px;border:1px solid var(--border);}
  .checkbox-row input{margin-top:3px;}
  .footer-note{font-size:.78rem;color:var(--text-dim);text-align:center;margin-top:30px;opacity:.7;}
  #summaryBlock{
    white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:.75rem;
    background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:16px;
    max-height:280px;overflow-y:auto;color:var(--text-dim);
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:var(--bg);padding:10px 18px;border-radius:20px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:100;
  }
  .toast.show{opacity:1;}
  @media(max-width:480px){
    .name-hero{font-size:1.9rem;}
    .reactions{grid-template-columns:1fr;}
    .swatches{flex-wrap:wrap;}
  }
</style>
</head>

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function goTo(n){

  window.scrollTo({top:0,behavior:'smooth'});
}

function nombreById(id){ return NOMBRES.find(n=>n.id===id); }

function regresar(){
  if(state.screen === 0) return;
  if(state.screen === 4){
    if(cardIndex > 0){ cardIndex--; render(); }
    else { goTo(3); }
    return;
  }
  if(state.screen === 5){
    cardIndex = NOMBRES.length - 1;
    goTo(4);
    return;
  }
  if(state.screen === 6 && state.orden.length === 1){
    cardIndex = NOMBRES.length - 1;
    goTo(4);
    return;
  }
  goTo(state.screen - 1);
}

/* ---------- RENDER ENGINE ---------- */

const TOTAL_SCREENS = 16;

function updateProgress(){
  const pct = Math.round((state.screen/(TOTAL_SCREENS-1))*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `PASO ${state.screen+1} DE ${TOTAL_SCREENS}`;
  document.getElementById('backBtn').style.display = state.screen===0 ? 'none' : 'inline-block';
}

function render(){
  updateProgress();
  const el = document.getElementById('screens');
  el.innerHTML = '';
  const fn = SCREENS[state.screen];
  const section = document.createElement('div');
  section.className='screen active';
  section.innerHTML = fn();
  el.appendChild(section);
  bindScreenEvents();
}

      <span class="pos">${i+1}</span>
      <span class="name">${opt}</span>
      <span class="arrows">
        <button ${i===0?'disabled':''} onclick="moverLegal(${i},-1)">↑</button>
        <button ${i===state.legalOrden.length-1?'disabled':''} onclick="moverLegal(${i},1)">↓</button>
      </span>
    </li>`).join('');
  return `
    <h2>Últimos puntos</h2>
    <div class="checkbox-row">
      <input type="checkbox" id="chk1" ${state.confirmDecisionPropia?'checked':''} onchange="state.confirmDecisionPropia=this.checked; saveState();">
      <label for="chk1">Esta decisión la tomé yo, sabiendo que puedo platicarla con quien quiera, pero que la responsabilidad final es mía.</label>
    </div>
    <p><strong>Fecha:</strong> te pedimos que nos regreses esto en las próximas <strong>72 horas</strong>. En cuanto lo hagas, agendamos 20 minutos para cerrarlo juntos.</p>

    <div class="card">
      <h3>Sobre el nombre legal</h3>
      <p>El nombre comercial que acabas de elegir no es el nombre legal de la empresa, el que va a ir en el acta constitutiva. Van a ser distintos, y eso es normal: nuestra propia empresa se llama "RARE Consulting" en la calle y "RARE Consultoría Estratégica S.A.S." ante notario.</p>
      <p>No te lo vamos a complicar ahorita. Aquí abajo van cinco opciones de nombre legal, ya construidas sobre <strong>${n.nombre}</strong>, para que las ordenes de tu preferida a tu menos preferida. Con eso, Carlos Rangel (el abogado) arranca el trámite.</p>
      <p style="font-size:.85rem;">Nota: las pusimos como <strong>S.A.</strong> solo para fines prácticos, para que veas cómo se leería el nombre completo. La figura legal final (S.A., S.A.S., S. de R.L., u otra) todavía no está decidida, eso se resuelve aparte con Carlos Rangel.</p>
      <ol class="orderlist">${items}</ol>
    </div>

    <div class="btn-row"><button class="btn btn-primary" onclick="goTo(15)">Seguir</button></div>
  `;
};

function moverLegal(i, dir){
  const j = i+dir;
  if(j<0 || j>=state.legalOrden.length) return;
  [state.legalOrden[i], state.legalOrden[j]] = [state.legalOrden[j], state.legalOrden[i]];
  saveState(); render();
}

/* ---------- PANTALLA 15: entrega ---------- */

function buildMarkdown(){
  const n = nombreById(state.ganador);
  const nDesc = NOMBRES.map(x=>`- ${x.nombre}: ${state.reacciones[x.id] || 'sin reacción'}`).join('\n');
  const tonoTxt = TONOS.map((par,i)=>`- ${par[0]} <-> ${par[1]}: ${state.tono[i]}/100`).join('\n');
  const paletasLike = state.paletaLike.map(id=>PALETAS.find(p=>p.id===id).nombre).join(', ') || 'ninguna marcada';
  const paletasDisc = state.paletaDiscard.map(id=>PALETAS.find(p=>p.id===id).nombre).join(', ') || 'ninguna';
  const tipoTxt = TIPOGRAFIAS.map(t=>{
    const descartado = state.tipografiaDescartada[t.id];
    return `- ${t.estilo}: ${descartado ? 'descartado' : (state.tipografia[t.id] || 'sin elegir')}`;
  }).join('\n');
  const tipoOrdenTxt = state.tipoOrden.length
    ? state.tipoOrden.map((catId,i)=>{
        const t = TIPOGRAFIAS.find(x=>x.id===catId);
        return `${i+1}. ${t.estilo} (${state.tipografia[catId]})`;
      }).join('\n')
    : 'Descartó los cinco estilos';
  const aplicTxt = state.aplicacionesElegidas.length
    ? state.aplicacionesElegidas.map((a,i)=>`${i+1}. ${a}`).join('\n')
    : '(sin elegir)';
  const legalTxt = state.legalOrden.map((l,i)=>`${i+1}. ${l}`).join('\n');

  return `# Respuestas de James — decisión de nombre y branding

Fecha de respuesta: ${new Date().toLocaleDateString('es-MX')}

## Nombre ganador
**${n.nombre}**

## Reacciones a los 4 finalistas
${nDesc}

## Orden de preferencia
${state.orden.map((id,i)=>`${i+1}. ${nombreById(id).nombre}`).join('\n')}

## ¿Qué le dirías a un cliente que pregunte por qué se llama así?
${state.preguntaCliente || '(sin respuesta)'}

## ¿Convenció como ganador?
${state.convence ? 'Sí' : 'No indicado'}

## Tono de marca
${tonoTxt}

## Paleta de color
Le gustaron: ${paletasLike}
Descartó: ${paletasDisc}

## Tipografía elegida por estilo
${tipoTxt}

## Orden final de estilos (comparación entre los no descartados)
${tipoOrdenTxt}

## Referencias
Marcas que le gustan y por qué:
${state.refGusta || '(sin respuesta)'}

Qué NO quiere que parezca su marca:
${state.refNoQuiere || '(sin respuesta)'}

Competencia bien resuelta:
${state.refCompetencia || '(sin respuesta)'}

## Las 3 aplicaciones más importantes para él
${aplicTxt}

## Confirmaciones
Decisión tomada por él mismo: ${state.confirmDecisionPropia ? 'Sí' : 'No marcado'}

## Orden de preferencia de nombre legal
${legalTxt}
`;
}

SCREENS[15] = () => `
  <h2>Ya casi</h2>
  <p>Dale clic al botón de abajo para descargar un archivo con todas tus respuestas. Adjúntalo en un correo o WhatsApp y mándanoslo. Si por alguna razón la descarga no funciona en tu navegador, hay un botón de respaldo que copia todo al portapapeles, y más abajo el texto queda visible por si prefieres copiarlo a mano.</p>
  <div class="btn-row center">
    <button class="btn btn-primary" onclick="descargarMD()">Descargar mis respuestas (.md)</button>
    <button class="btn btn-ghost" onclick="copiarMD()">Copiar todas mis respuestas</button>
  </div>
  <p style="margin-top:24px;font-size:.85rem;">Respaldo, por si necesitas copiarlo a mano:</p>
  <div id="summaryBlock">${buildMarkdown()}</div>
`;

function descargarMD(){
  const md = buildMarkdown();
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respuestas-naming-${nombreById(state.ganador).nombre.toLowerCase()}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Descargado. Ya lo puedes adjuntar en tu mensaje.');
}

function copiarMD(){
  const md = buildMarkdown();
  navigator.clipboard.writeText(md).then(()=>{
    toast('Copiado. Pégalo en WhatsApp o correo.');
  }).catch(()=>{
    toast('No se pudo copiar automático. Usa el texto de abajo.');
  });
}

</script>
