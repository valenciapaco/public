<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fix it! Anfitrión</title>
<meta name="description" content="Asistente del anfitrión para Fix it!, juego de creatividad de KEEWE. Prototipo funcional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una sola columna de app móvil (máx. 460px), barra superior con progreso y acción principal fija abajo */
:root {
  --bg: #f7f5f9;
  --surface: #ffffff;
  --ink: #1d1722;
  --muted: #6b6273;
  --line: #e4dfe9;
  --accent: #85409d;
  --accent-ink: #ffffff;
  --accent-soft: #f1e7f5;
  --pain: #c2185b;
  --pain-soft: #fdebf2;
  --gain: #0f7f7a;
  --gain-soft: #e3f4f2;
  --gold: #e8b923;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131b; --surface: #221c27; --ink: #f2edf5; --muted: #b0a6b8; --line: #3a3141;
    --accent: #c08ad6; --accent-ink: #1a1220; --accent-soft: #33253b;
    --pain: #f06b9c; --pain-soft: #3d1f2b; --gain: #4fc6bf; --gain-soft: #17322f; --gold: #f0c94a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131b; --surface: #221c27; --ink: #f2edf5; --muted: #b0a6b8; --line: #3a3141;
  --accent: #c08ad6; --accent-ink: #1a1220; --accent-soft: #33253b;
  --pain: #f06b9c; --pain-soft: #3d1f2b; --gain: #4fc6bf; --gain-soft: #17322f; --gold: #f0c94a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 0 24px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { font: 700 20px/1 var(--font-display); letter-spacing: -0.01em; }
.brand b { color: var(--accent); }
.top .spacer { flex: 1; min-width: 4px; }
.top .step { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 12px; font: 600 14px var(--font-body); cursor: pointer; }
main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-block: 18px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 24px; line-height: 1.15; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 12px; padding: 15px 18px; font: 600 17px var(--font-body); cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); padding: 10px; font-size: 15px; }
.btn.danger { background: var(--pain); color: #fff; }
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 8px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cards3 { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.deck { border-radius: 10px; padding: 10px 8px; text-align: center; font: 600 13px/1.2 var(--font-display); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.deck small { font: 500 11px/1.2 var(--font-body); color: var(--muted); }
.deck .ico { font-size: 22px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
input[type=text] { flex: 1; font: 16px var(--font-body); padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
input[type=text]:focus { border-color: var(--accent); outline: none; }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.players li { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 14px var(--font-display); flex: none; }
.players li .name { flex: 1; font-weight: 500; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 6px; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.msg.error { background: var(--pain-soft); color: var(--pain); }
.msg.warn { background: var(--accent-soft); color: var(--ink); }
.msg.ok { background: var(--gain-soft); color: var(--gain); }
.estimate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; border-radius: 9px; padding: 9px; font: 600 14px var(--font-body); background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { display: flex; align-items: center; gap: 12px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 6px; }
.formula { font: 600 18px/1.5 var(--font-display); background: var(--accent-soft); border-radius: 12px; padding: 14px; }
.formula u { text-decoration: none; border-bottom: 2px dashed var(--accent); padding: 0 4px; color: var(--accent); }
.banner { border-radius: 12px; padding: 10px 12px; background: var(--gain-soft); color: var(--gain); font-weight: 600; font-size: 14px; }
.judge { text-align: center; padding: 20px 16px; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); }
.judge .eyebrow { color: var(--accent-ink); opacity: 0.85; }
.judge b { display: block; font: 700 40px/1.05 var(--font-display); margin-top: 6px; }
.role { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.pill { display: inline-block; font: 600 11px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
.pill.show { background: var(--gain-soft); color: var(--gain); }
.pill.secret { background: var(--pain-soft); color: var(--pain); }
.role .tag { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 15px var(--font-display); }
.timer { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; }
.ring { width: 220px; height: 220px; max-width: 100%; }
.ring text { font: 700 54px var(--font-display); fill: var(--ink); font-variant-numeric: tabular-nums; }
.ring .track { fill: none; stroke: var(--line); stroke-width: 12; }
.ring .bar { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear; }
.ring.done .bar { stroke: var(--pain); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.crit { display: flex; flex-direction: column; gap: 8px; }
.crit .head { display: flex; align-items: baseline; gap: 10px; }
.pts { font: 700 22px/1 var(--font-display); color: var(--accent); min-width: 44px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 500 15px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip:disabled { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }
.board { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.board li { display: grid; grid-template-columns: 26px 30px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.board .pos { font: 600 14px var(--font-mono); color: var(--muted); }
.board .score { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.board .delta { font: 600 12px var(--font-mono); color: var(--gain); }
.board li.lead { border-color: var(--gold); box-shadow: inset 4px 0 0 var(--gold); }
.judged { font: 500 11px var(--font-mono); color: var(--muted); letter-spacing: 0.03em; }
.judged.yes { color: var(--gain); }
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.winner { text-align: center; padding: 26px 16px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--gold); display: flex; flex-direction: column; gap: 6px; }
.winner b { font: 700 42px/1.05 var(--font-display); }
.sheet-bg { position: fixed; inset: 0; background: rgba(20, 10, 25, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 460px; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow: auto; }
.ex { font-size: 12px; font-family: var(--font-mono); color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist label { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.checklist input { width: 20px; height: 20px; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function () {
  "use strict";
  const $app = document.getElementById("app");
  const MAX = 10, MIN = 3;
  const EXAMPLE = ["Daniela", "Luis", "Ana", "André"];

  let S = fresh();
  function fresh() {
    return { screen: "home", players: [], timer: 60, laps: 1, practice: true, howto: 0, round: 0, judgeIdx: 0, isPractice: false,
      phase: "prep", remaining: 60, roundTotal: 60, running: false, scores: {}, judged: [], last: {}, pick: { 3: null, 2: null, 1: null },
      err: "", sheet: null, presented: [], fromHome: false };
  }

  // ---------- utilidades ----------
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initial = (n) => esc(n.trim().charAt(0).toUpperCase());
  const inventors = () => S.players.filter((_, i) => i !== S.judgeIdx);
  const criteria = () => {
    const n = inventors().length;
    const all = [
      { pts: 3, label: "Mejor resuelve mi necesidad", help: "El invento que mejor responde a \"Soy, estoy en, necesito\". Si nadie la resolvió, no se reparte.", optional: true },
      { pts: 2, label: "Mi favorito", help: "El que más te gustó o te pareció más útil." },
      { pts: 1, label: "Mención especial", help: "El más ingenioso o gracioso. No es un punto de consolación." }
    ];
    return n >= 3 ? all : all.slice(0, 2);
  };
  function estimate(n, t) {
    if (n < 1) return { rounds: 0, min: 0 };
    const perRound = t + Math.max(0, n - 1) * 40 + 75; // creación + presentaciones de 40 s + juicio
    const rounds = n * S.laps;
    const total = rounds * perRound + (S.practice ? perRound : 0);
    return { rounds, min: Math.round(total / 60) };
  }
  function go(screen) { stopTick(); S.screen = screen; S.err = ""; render(); window.scrollTo(0, 0); }

  // ---------- temporizador ----------
  let tick = null;
  function startTick() {
    stopTick(); S.running = true;
    tick = setInterval(() => {
      S.remaining = Math.max(0, S.remaining - 1);
      if (S.remaining === 0) { S.running = false; stopTick(); S.phase = "present"; render(); return; }
      paintTimer();
    }, 1000);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function paintTimer() {
    const t = document.getElementById("t-num"), b = document.getElementById("t-bar");
    if (!t || !b) return;
    t.textContent = fmt(S.remaining);
    const C = 2 * Math.PI * 92;
    b.style.strokeDashoffset = String(C * (1 - S.remaining / S.roundTotal));
  }
  const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

  // ---------- pantallas ----------
  function top(step, opts = {}) {
    return `<header class="top"><span class="brand">Fix <b>it!</b></span><span class="spacer"></span>
      ${step ? `<span class="step">${step}</span>` : ""}
      ${opts.help ? `<button class="iconbtn" data-act="help" aria-label="Ayuda">?</button>` : ""}
      ${opts.exit ? `<button class="iconbtn" data-act="exit">Salir</button>` : ""}</header>`;
  }

  function vHome() {
    return top("Asistente del anfitrión") + `<main>
      <span class="eyebrow">Para quien organiza la partida</span>
      <h1>Tú pon las cartas. La app lleva las reglas, el tiempo y los puntos.</h1>
      <p class="muted">Inventa cosas absurdas para personajes con necesidades raras. De 3 a 10 personas, con el mazo físico de Fix it!.</p>
      <div class="cards3" aria-label="Los tres mazos">
        <div class="deck"><span class="ico" aria-hidden="true">🔧</span>Objetos<small>plancha, cohete, taza</small></div>
        <div class="deck"><span class="ico" aria-hidden="true">💡</span>Retos<small>"hazlo diez veces más pesado"</small></div>
        <div class="deck"><span class="ico" aria-hidden="true">🎭</span>Personajes<small>buzo, Batman, niño de 6</small></div>
      </div>
      <div class="actions">
        <button class="btn primary" data-act="new">Nueva partida</button>
        <button class="btn ghost" data-act="howto-home">¿Cómo se juega?</button>
      </div></main>`;
  }

  function vSetup() {
    const n = S.players.length, e = estimate(n, S.timer);
    let note = "";
    if (S.err) note = `<div class="msg error" role="alert">${esc(S.err)}</div>`;
    else if (n > 0 && n < MIN) note = `<div class="msg warn">Faltan ${MIN - n} para empezar. Se necesitan al menos 3: un juez y dos inventores.</div>`;
    else if (n >= 8) note = `<div class="msg warn">Con ${n} personas la partida dura unos ${e.min} minutos. Si el grupo es grande, conviene jugar una sola vuelta.</div>`;
    return top("1 · Jugadores") + `<main>
      <h2>¿Quiénes juegan?</h2>
      <form class="row" id="addform" autocomplete="off">
        <input type="text" id="pname" placeholder="Nombre" maxlength="18" aria-label="Nombre del jugador" ${n >= MAX ? "disabled" : ""}>
        <button class="iconbtn" type="submit" style="height:48px;padding:0 18px" ${n >= MAX ? "disabled" : ""}>Agregar</button>
      </form>
      ${n === 0 ? `<button class="btn quiet" data-act="example">Usar ejemplo con 4 jugadores</button>` : ""}
      <ul class="players">${S.players.map((p, i) => `<li><span class="avatar">${initial(p)}</span><span class="name">${esc(p)}</span>${i === 0 ? `<span class="ex">anfitrión</span>` : ""}<button class="x" data-del="${i}" aria-label="Quitar a ${esc(p)}">×</button></li>`).join("")}</ul>
      ${note}
      <div class="card">
        <span class="eyebrow">Tiempo para inventar</span>
        <div class="seg" role="group" aria-label="Tiempo por ronda">
          <button data-time="60" aria-pressed="${S.timer === 60}">60 segundos</button>
          <button data-time="90" aria-pressed="${S.timer === 90}">90 segundos</button>
        </div>
        <span class="eyebrow">Vueltas</span>
        <div class="seg" role="group" aria-label="Número de vueltas" style="grid-template-columns:repeat(3,1fr)">
          <button data-laps="1" aria-pressed="${S.laps === 1}">1 vuelta</button>
          <button data-laps="2" aria-pressed="${S.laps === 2}">2 vueltas</button>
          <button data-laps="3" aria-pressed="${S.laps === 3}">3 vueltas</button>
        </div>
        <p class="muted" style="font-size:14px">En cada vuelta todos son juez una vez.</p>
        <label class="toggle"><input type="checkbox" id="practice" ${S.practice ? "checked" : ""}> <span>Empezar con una ronda de prueba <span class="muted">(recomendado si alguien juega por primera vez)</span></span></label>
      </div>
      ${n >= MIN ? `<div class="estimate">
        <div class="stat"><b>${n}</b><span>jugadores</span></div>
        <div class="stat"><b>${e.rounds}</b><span>rondas (${n} × ${S.laps})</span></div>
        <div class="stat"><b>~${e.min}</b><span>minutos</span></div></div>` : ""}
      <div class="actions"><button class="btn primary" data-act="setup-go" ${n < MIN ? "disabled" : ""}>Continuar</button>
      <button class="btn quiet" data-act="home">Volver</button></div></main>`;
  }

  const HOWTO = [
    { t: "Dos roles por ronda", b: `<p>En cada ronda una persona es el <b>juez</b> y las demás son <b>inventores</b>. Todos serán juez una vez.</p>
       <div class="role"><span class="tag">I</span><p><b>Inventores:</b> toman una carta de <b>objeto</b> y una de <b>reto</b>. Con eso inventan algo.</p></div>
       <div class="role"><span class="tag">J</span><p><b>Juez:</b> toma una carta de <b>personaje</b> y la muestra a todos <span class="pill show">no es secreta</span>. Es para quien inventan.</p></div>` },
    { t: "El secreto del juez", b: `<p>Mientras corre el tiempo, el juez completa en secreto esta frase:</p>
       <div class="formula">Soy <u>buzo</u>, estoy en <u>la cárcel</u> y necesito <u>quitarme el traje</u>.</div>
       <p class="muted">La carta del personaje se muestra a todos desde el inicio. Lo único secreto es el lugar y la necesidad, que inventa el juez y nadie sabe hasta el final.</p>` },
    { t: "Cómo se gana", b: `<p>Cada inventor presenta en 30 segundos. El juez revela su frase y reparte los siguientes puntos:</p>
       <div class="role"><span class="tag">3</span><p>Al que <b>mejor resuelve su necesidad</b>.</p></div>
       <div class="role"><span class="tag">2</span><p>A su <b>favorito</b>.</p></div>
       <div class="role"><span class="tag">1</span><p>Una <b>mención especial</b> al más ingenioso o gracioso.</p></div>
       <p class="muted">Cada puntaje va a una persona distinta. Si nadie resolvió la necesidad, el +3 no se reparte. Escribir es más rápido; dibujar es opcional. La app lleva el marcador.</p>` }
  ];
  function vHowto() {
    const i = S.howto, c = HOWTO[i], last = i === HOWTO.length - 1;
    const cta = S.fromHome ? (last ? "Nueva partida" : "Siguiente") : (last ? (S.practice ? "Empezar ronda de prueba" : "Empezar partida") : "Siguiente");
    return top(S.fromHome ? "Cómo se juega" : "2 · Cómo se juega") + `<main>
      <div class="dots" aria-label="Paso ${i + 1} de 3">${HOWTO.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <span class="eyebrow">Paso ${i + 1} de 3</span>
      <h2>${c.t}</h2>
      <div class="card">${c.b}</div>
      <div class="actions"><button class="btn primary" data-act="howto-next">${cta}</button>
      ${i > 0 ? `<button class="btn quiet" data-act="howto-back">Atrás</button>` : (S.fromHome ? `<button class="btn quiet" data-act="home">Volver</button>` : `<button class="btn quiet" data-act="skip-howto">Ya sabemos jugar, saltar</button>`)}</div></main>`;
  }

  function roundLabel() { return S.isPractice ? "Ronda de prueba" : `Ronda ${S.round} de ${S.players.length * S.laps}`; }
  const judgeCount = (i) => S.judged.filter((j) => j === i).length;

  function vRound() {
    const judge = S.players[S.judgeIdx];
    const pb = S.isPractice ? `<div class="banner">Ronda de prueba: los puntos no cuentan. Sigan los pasos en pantalla.</div>` : "";
    if (S.phase === "prep") {
      return top(roundLabel(), { help: true, exit: true }) + `<main>${pb}
        <div class="judge"><span class="eyebrow">Juez de esta ronda</span><b>${esc(judge)}</b></div>
        <div class="card">
          <span class="eyebrow">Antes de iniciar el tiempo</span>
          <div class="role"><span class="tag">1</span><p><b>${esc(inventors().join(", "))}:</b> cada quien toma una carta de <b>objeto</b> y una de <b>reto</b>.</p></div>
          <div class="role"><span class="tag">2</span><p><b>${esc(judge)}:</b> toma una carta de <b>personaje</b> y <b>muéstrala a todos</b> <span class="pill show">se muestra</span></p></div>
          <div class="role"><span class="tag">3</span><p>Lo único secreto es lo que ${esc(judge)} inventa durante el tiempo: dónde está y qué necesita <span class="pill secret">secreto</span></p></div>
        </div>
        <div class="actions"><button class="btn primary" data-act="start">Todos vieron el personaje: iniciar ${S.timer} s</button></div></main>`;
    }
    if (S.phase === "timer") {
      const C = 2 * Math.PI * 92;
      return top(roundLabel(), { help: true, exit: true }) + `<main>${pb}
        <div class="timer">
          <span class="eyebrow">Inventen para el personaje que mostró ${esc(judge)}</span>
          <svg class="ring" viewBox="0 0 220 220" role="timer" aria-live="off">
            <circle class="track" cx="110" cy="110" r="92"></circle>
            <circle class="bar" id="t-bar" cx="110" cy="110" r="92" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - S.remaining / S.roundTotal)}" transform="rotate(-90 110 110)"></circle>
            <text id="t-num" x="110" y="128" text-anchor="middle">${fmt(S.remaining)}</text>
          </svg>
          <p class="muted">${esc(judge)}: completa en secreto "Soy..., estoy en... y necesito...".</p>
          <div class="btnrow">
            <button class="btn ghost" data-act="pause">${S.running ? "Pausar" : "Seguir"}</button>
            <button class="btn ghost" data-act="plus">+30 s</button>
          </div>
          <button class="btn quiet" data-act="endtime">Ya terminamos todos</button>
        </div></main>`;
    }
    // presentaciones
    return top(roundLabel(), { help: true, exit: true }) + `<main>${pb}
      <div class="msg ok">¡Tiempo! Cada inventor presenta su invento en 30 segundos.</div>
      <ul class="checklist">${inventors().map((p) => `<li><label><input type="checkbox" data-pres="${esc(p)}" ${S.presented.includes(p) ? "checked" : ""}> ${esc(p)} presentó</label></li>`).join("")}</ul>
      <div class="card"><span class="eyebrow">Después, ${esc(judge)} revela</span><div class="formula">Soy <u>...</u>, estoy en <u>...</u> y necesito <u>...</u></div></div>
      <div class="actions"><button class="btn primary" data-act="toscore">${esc(judge)} ya reveló: repartir puntos</button></div></main>`;
  }

  function vScore() {
    const judge = S.players[S.judgeIdx], crit = criteria();
    const used = Object.values(S.pick).filter((v) => v && v !== "__none__");
    const complete = crit.every((c) => S.pick[c.pts]);
    const two = inventors().length === 2 ? `<div class="msg warn">Con dos inventores solo se reparten 3 y 2 puntos, a personas distintas.</div>` : "";
    return top(roundLabel(), { help: true, exit: true }) + `<main>
      ${S.isPractice ? `<div class="banner">Ronda de prueba: practiquen cómo se reparten los puntos.</div>` : ""}
      <span class="eyebrow">${esc(judge)} decide</span>
      <h2>¿A quién le das cada puntaje?</h2>
      ${two}
      ${crit.map((c) => `<div class="card crit"><div class="head"><span class="pts">+${c.pts}</span><div><b>${c.label}</b><p class="muted" style="font-size:14px">${c.help}</p></div></div>
        <div class="chips">${inventors().map((p) => { const mine = S.pick[c.pts] === p; const taken = !mine && used.includes(p);
          return `<button class="chip" data-pts="${c.pts}" data-who="${esc(p)}" aria-pressed="${mine}" ${taken ? "disabled" : ""}>${esc(p)}</button>`; }).join("")}
          ${c.optional ? `<button class="chip" data-pts="${c.pts}" data-who="__none__" aria-pressed="${S.pick[c.pts] === "__none__"}">Nadie resolvió mi necesidad</button>` : ""}</div></div>`).join("")}
      ${S.err ? `<div class="msg error" role="alert">${esc(S.err)}</div>` : `<p class="muted" style="font-size:14px">Cada puntaje va a una persona distinta.</p>`}
      <div class="actions"><button class="btn primary" data-act="confirm" aria-disabled="${!complete}">${S.isPractice ? "Terminar ronda de prueba" : "Confirmar puntos"}</button></div></main>`;
  }

  function ranking() {
    return S.players.map((p, i) => ({ p, i, s: S.scores[p] || 0 })).sort((a, b) => b.s - a.s || a.i - b.i);
  }

  function vBoard() {
    const n = S.players.length, total = n * S.laps, done = S.judged.length, rank = ranking(), lead = rank[0].s;
    const pending = Array.from({ length: total - done });
    const nextIdx = done % n;
    const left = estimate(n, S.timer).min * (total - done) / total;
    const lap = Math.min(S.laps, Math.floor(done / n) + 1);
    return top(`Marcador · ${done} de ${total}`, { help: true, exit: true }) + `<main>
      <span class="eyebrow">${done} de ${total} rondas${S.laps > 1 ? ` · vuelta ${lap} de ${S.laps}` : ""}</span>
      <div class="progress" aria-hidden="true"><i style="width:${(done / total) * 100}%"></i></div>
      <ol class="board">${rank.map((r, k) => `<li class="${r.s > 0 && r.s === lead ? "lead" : ""}"><span class="pos">${k + 1}</span><span class="avatar">${initial(r.p)}</span>
        <span><b>${esc(r.p)}</b><br><span class="judged ${judgeCount(r.i) ? "yes" : ""}">${judgeCount(r.i) ? (S.laps > 1 ? `✓ juez ${judgeCount(r.i)} de ${S.laps}` : "✓ ya fue juez") : "falta ser juez"}</span></span>
        <span style="text-align:right"><span class="score">${r.s}</span>${S.last[r.p] ? `<br><span class="delta">+${S.last[r.p]}</span>` : ""}</span></li>`).join("")}</ol>
      ${pending.length ? `<p class="muted">Faltan ${pending.length} ${pending.length === 1 ? "ronda" : "rondas"}, unos ${Math.max(1, Math.round(left))} minutos. Siguiente juez: <b>${esc(S.players[nextIdx])}</b>.</p>` : ""}
      <div class="actions">
        ${pending.length ? `<button class="btn primary" data-act="next">Siguiente ronda: juez ${esc(S.players[nextIdx])}</button>
        <button class="btn quiet" data-act="finish-early">Terminar la partida ahora</button>` : `<button class="btn primary" data-act="finish">Ver ganador</button>`}
      </div></main>`;
  }

  function vEnd() {
    const rank = ranking(), top1 = rank[0].s, winners = rank.filter((r) => r.s === top1 && top1 > 0);
    const allJudged = S.judged.length % S.players.length === 0 && S.judged.length > 0;
    return top("Fin de la partida") + `<main>
      <div class="winner"><span class="eyebrow">${winners.length > 1 ? "Empate" : "Gana"}</span><b>${esc(winners.map((w) => w.p).join(" y ") || "Nadie sumó puntos")}</b><span class="muted">${top1} puntos</span></div>
      ${allJudged ? `<div class="msg ok">Todos fueron juez el mismo número de veces. Partida pareja.</div>` : `<div class="msg warn">La partida terminó antes de que todos fueran juez el mismo número de veces.</div>`}
      <ol class="board">${rank.map((r, k) => `<li><span class="pos">${k + 1}</span><span class="avatar">${initial(r.p)}</span><span><b>${esc(r.p)}</b></span><span class="score">${r.s}</span></li>`).join("")}</ol>
      <div class="actions"><button class="btn primary" data-act="again">Jugar otra con el mismo grupo</button>
      <button class="btn quiet" data-act="reset">Nueva partida desde cero</button></div></main>`;
  }

  function vSheet() {
    if (S.sheet === "help") return `<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-label="Ayuda">
      <h2>Ayuda rápida</h2>
      <div class="card"><b>¿Qué hace el juez?</b><p>Muestra su carta de personaje a todos (no es secreta) y, mientras corre el tiempo, completa en secreto: "Soy..., estoy en... y necesito...". Al final la revela y reparte los puntos.</p></div>
      <div class="card"><b>¿Cómo se puntúa?</b><p>+3 al que mejor resuelve la necesidad (si nadie la resolvió, no se reparte). +2 a su favorito. +1 mención especial al más ingenioso o gracioso. Cada puntaje a una persona distinta. Con dos inventores, solo 3 y 2.</p></div>
      <div class="card"><b>¿Cuándo termina?</b><p>Cuando se completan las vueltas que eligieron. En cada vuelta todos son juez una vez. La app lleva la cuenta.</p></div>
      <button class="btn primary" data-act="close">Entendido</button></div></div>`;
    if (S.sheet === "exit") return `<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Salir">
      <h2>¿Salir de la partida?</h2><p>Se perderá el marcador actual.</p>
      <button class="btn danger" data-act="reset">Salir y borrar</button><button class="btn quiet" data-act="close">Seguir jugando</button></div></div>`;
    if (S.sheet === "early") { const mx = Math.max(...S.players.map((_, i) => judgeCount(i))); const pend = S.players.filter((_, i) => judgeCount(i) < mx);
      const txt = pend.length ? `${esc(pend.join(", "))} ${pend.length === 1 ? "ha sido juez menos veces" : "han sido juez menos veces"} que los demás. Quien fue juez menos veces tuvo más rondas para sumar puntos.` : "Todos han sido juez el mismo número de veces, así que la partida queda pareja.";
      return `<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Terminar">
      <h2>¿Terminar ahora?</h2><p>${txt}</p>
      <button class="btn primary" data-act="finish">Terminar y ver ganador</button><button class="btn quiet" data-act="close">Seguir jugando</button></div></div>`; }
    return "";
  }

  function render() {
    const views = { home: vHome, setup: vSetup, howto: vHowto, round: vRound, score: vScore, board: vBoard, end: vEnd };
    $app.innerHTML = views[S.screen]() + vSheet();
    if (S.screen === "setup") { const i = document.getElementById("pname"); if (i && !S.sheet) i.focus({ preventScroll: true }); }
  }

  // ---------- acciones ----------
  function beginRound(practice) {
    S.isPractice = practice;
    if (practice) S.judgeIdx = 0;
    else { S.judgeIdx = S.judged.length % S.players.length; S.round = S.judged.length + 1; }
    S.phase = "prep"; S.remaining = S.timer; S.roundTotal = S.timer; S.pick = { 3: null, 2: null, 1: null }; S.presented = [];
    go("round");
  }

  $app.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const inp = document.getElementById("pname"); const name = (inp.value || "").trim();
    if (!name) { S.err = "Escribe un nombre antes de agregarlo."; return render(); }
    if (S.players.some((p) => p.toLowerCase() === name.toLowerCase())) { S.err = `Ya hay alguien llamado ${name}. Agrega una inicial para distinguirlos.`; return render(); }
    if (S.players.length >= MAX) { S.err = "El máximo es 10 jugadores."; return render(); }
    S.players.push(name); S.err = ""; render();
  });

  $app.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "practice") S.practice = t.checked;
    if (t.dataset.pres) { const p = t.dataset.pres; S.presented = t.checked ? [...S.presented, p] : S.presented.filter((x) => x !== p); }
  });

  $app.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act],[data-del],[data-time],[data-laps],[data-pts]");
    if (!el) return;
    if (el.classList.contains("sheet-bg") && ev.target !== el) return;
    if (el.dataset.del !== undefined) { S.players.splice(+el.dataset.del, 1); S.err = ""; return render(); }
    if (el.dataset.time) { S.timer = +el.dataset.time; return render(); }
    if (el.dataset.laps) { S.laps = +el.dataset.laps; return render(); }
    if (el.dataset.pts) {
      const pts = +el.dataset.pts, who = el.dataset.who;
      S.pick[pts] = S.pick[pts] === who ? null : who; S.err = ""; return render();
    }
    const a = el.dataset.act;
    switch (a) {
      case "new": S.fromHome = false; return go("setup");
      case "home": return go("home");
      case "howto-home": S.fromHome = true; S.howto = 0; return go("howto");
      case "example": S.players = EXAMPLE.slice(); return render();
      case "setup-go": S.fromHome = false; S.howto = 0; S.scores = {}; S.judged = []; S.last = {};
        return S.practice ? go("howto") : beginRound(false);
      case "howto-next":
        if (S.howto < HOWTO.length - 1) { S.howto++; return render(); }
        if (S.fromHome) { S.fromHome = false; return go("setup"); }
        return beginRound(S.practice);
      case "howto-back": S.howto--; return render();
      case "skip-howto": return beginRound(false);
      case "start": S.phase = "timer"; S.remaining = S.timer; S.roundTotal = S.timer; render(); return startTick();
      case "pause": if (S.running) { S.running = false; stopTick(); } else startTick(); return render();
      case "plus": S.remaining += 30; if (S.remaining > S.roundTotal) S.roundTotal = S.remaining; return paintTimer();
      case "endtime": stopTick(); S.running = false; S.phase = "present"; return render();
      case "toscore": return go("score");
      case "confirm": {
        const crit = criteria();
        const missing = crit.filter((c) => !S.pick[c.pts]).map((c) => "+" + c.pts);
        if (missing.length) { S.err = `Falta decidir ${missing.join(" y ")}. Toca un nombre en cada puntaje${S.pick[3] ? "" : " (en el +3 también puedes elegir \"Nadie resolvió mi necesidad\")"}.`; return render(); }
        if (S.isPractice) { S.last = {}; return beginRound(false); }
        S.last = {};
        crit.forEach((c) => { const p = S.pick[c.pts]; if (p === "__none__") return; S.scores[p] = (S.scores[p] || 0) + c.pts; S.last[p] = (S.last[p] || 0) + c.pts; });
        S.judged.push(S.judgeIdx);
        return go("board");
      }
      case "next": S.last = {}; return beginRound(false);
      case "finish-early": S.sheet = "early"; return render();
      case "finish": S.sheet = null; return go("end");
      case "again": { const p = S.players.slice(), t = S.timer, l = S.laps; S = fresh(); S.players = p; S.timer = t; S.laps = l; S.practice = false; return beginRound(false); }
      case "reset": { stopTick(); S = fresh(); return render(); }
      case "help": S.sheet = "help"; return render();
      case "exit": S.sheet = "exit"; return render();
      case "close": S.sheet = null; return render();
    }
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); } });

  // conservar la partida si la página se actualiza mientras alguien la usa
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ S: { ...S, running: false, sheet: null } }));
  const start = (data) => { if (data && data.S) { S = data.S; if (S.phase === "timer") S.running = false; } render(); };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body>
</html>
